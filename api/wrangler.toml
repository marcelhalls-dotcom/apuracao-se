# cademeuvoto-api — contas, cotas, dados privados, chat, contato e Stripe.
# NÃO versionar segredos. Segredos via `wrangler secret put` (ver DEPLOY.md).
name = "cademeuvoto-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Custom Domain (cria DNS + certificado). Exige permissão Workers Routes na zona.
routes = [{ pattern = "api.cademeuvoto.com.br", custom_domain = true }]

[vars]
ALLOWED_ORIGIN = "https://cademeuvoto.com.br,https://www.cademeuvoto.com.br"
SITE_BASE = "https://cademeuvoto.com.br"
DATA_BASE = "https://dados.cademeuvoto.com.br"
COOKIE_NAME = "__Host-cmv"
SESSION_DAYS = "30"
FREE_REPORTS = "2"
PRO_REPORTS = "50"
CORTESIA_REPORTS = "50"
GRACE_DAYS = "7"
CHAT_PRO_HOUR = "20"
CHAT_PRO_DAY = "100"
EMAIL_PROVIDER = "cloudflare"          # cloudflare | resend | mock
EMAIL_FALLBACK = "resend"              # usado se o principal falhar e RESEND_API_KEY existir
EMAIL_FROM_ADDR = "acesso@cademeuvoto.com.br"
EMAIL_FROM_NAME = "Cadê Meu Voto"
EMAIL_REPLY_TO = "acesso@cademeuvoto.com.br"   # encaminhado pelo Email Routing
TURNSTILE_REQUIRED = "1"
TURNSTILE_SITEKEY = "0x4AAAAAAFQo_ACurP4e8Mye"   # widget cademeuvoto-contas (pública)
STRIPE_ENABLED = "1"                   # Fase C ligada 15/10/2026 (live)
STRIPE_PRICE_LOOKUP = "cmv_mensal"
TERMOS_VERSAO = "2026-10"
ADMIN_EMAILS = "marcel@gerenciamento.com.br"
ROUTER_BASE = "https://omniroute-iicx.srv1890264.hstgr.cloud/v1"
ROUTER_MODEL = "cademeuvoto"
MAX_MSG_CHARS = "1000"
MAX_HISTORY = "8"
MAX_TOKENS = "1800"
CONTATO_RATE_HOUR = "5"
CONTATO_RATE_DAY = "20"

[[d1_databases]]
binding = "DB"
database_name = "cademeuvoto"
database_id = "b65cbb85-8a9c-4ba3-b357-e1def44001bc"   # D1 de produção (criado em 07/10/2026, região ENAM)
migrations_dir = "migrations"

# Fase B: bucket PRIVADO (sem domínio público nem r2.dev), criado em 07/10/2026 16:38 BRT
[[r2_buckets]]
binding = "DADOS_PRO"
bucket_name = "cademeuvoto-dados-pro"

[[kv_namespaces]]
binding = "CONTATO"
id = "9063be22a3604a1aa2831b17ce5a31aa"

[[kv_namespaces]]
binding = "RATE"
id = "b1cefa6127554e2ea67fd4a621391633"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["acesso@cademeuvoto.com.br"]

[[ratelimits]]
name = "RL_BURST"
namespace_id = "2601"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 9 * * *"]   # limpeza diária (06:17 BRT)

[observability]
enabled = true
