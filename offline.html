<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<meta name="robots" content="noindex">
<title>Sem conexão — Cadê Meu Voto</title>
<link rel="icon" href="/favicon.svg?v=20261007br1" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #0A1428; color: #F8FAFC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 40px rgba(37,99,235,.35); }
  h1 { font-size: 1.45rem; margin: 22px 0 8px; letter-spacing: -.01em; }
  p { color: #CBD5E1; line-height: 1.5; margin: 8px 0; font-size: .98rem; }
  .dica { color: #94A3B8; font-size: .86rem; }
  button { margin-top: 20px; min-height: 48px; padding: 12px 22px; border-radius: 12px; border: 0; background: #22C55E; color: #052E16;
    font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:focus-visible { outline: 3px solid #93C5FD; outline-offset: 3px; }
  .status { margin-top: 14px; min-height: 1.3em; font-size: .86rem; color: #86EFAC; }
</style>
</head>
<body>
<main>
  <img src="/brand/icon-192.png?v=20261007pwa2" alt="" width="88" height="88">
  <h1>Você está sem internet</h1>
  <p>O Cadê Meu Voto precisa de conexão para mostrar os resultados oficiais do TSE, os mapas e os relatórios.</p>
  <p class="dica">Confira o Wi-Fi ou os dados móveis. Assim que a conexão voltar, a página abre sozinha.</p>
  <button type="button" id="tentar">Tentar de novo</button>
  <div class="status" id="status" aria-live="polite"></div>
</main>
<script>
  (function () {
    var st = document.getElementById('status'), timer = null;
    function voltar() { st.textContent = 'Conectando…'; location.reload(); }
    // o evento "online" chega antes da rede funcionar de verdade: testa com um HEAD (não passa pelo cache do SW)
    function testar(espera) {
      clearTimeout(timer);
      fetch(location.pathname + '?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function (r) { if (r.ok) { st.textContent = 'Conexão de volta. Abrindo…'; voltar(); } else throw 0; })
        .catch(function () { timer = setTimeout(function () { testar(Math.min(espera * 2, 15000)); }, espera); });
    }
    document.getElementById('tentar').addEventListener('click', voltar);
    window.addEventListener('online', function () { st.textContent = 'Conexão de volta? Verificando…'; testar(1000); });
    if (navigator.onLine) timer = setTimeout(function () { testar(3000); }, 3000);
    setInterval(function () { if (navigator.onLine && !document.hidden) testar(3000); }, 15000);
  })();
</script>
</body>
</html>
